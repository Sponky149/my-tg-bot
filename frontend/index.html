<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />

<title>BrainuP</title>
<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
 
/* ============================================================
     ПАЛИТРА — тёмный фиолетово-чёрный неон
     ============================================================ */
  :root {
    --bg:        #08040d;
    --bg-2:      #11091c;
    --card:      #160c24;
    --card-2:    #221236;
    --field:     #0d0617;
    --stroke:    #3a2055;
    --text:      #f7f2ff;
    --muted:     #9b8aaa;

    --lime:      #d63dff;
    --emerald:   #ff2ee3;
    --cyan:      #8b5cff;
    --danger:    #ff4d7d;

    --radius:    18px;
    --radius-sm: 12px;
  }


  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    overscroll-behavior: none;
  }

  body {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 0 16px 110px;
    background:
      radial-gradient(90% 40% at 50% -5%, rgba(214,61,255,0.16), transparent 60%),
      radial-gradient(70% 50% at 100% 20%, rgba(139,92,255,0.12), transparent 60%),
      var(--bg);
  }

  .app-header {
    padding: 18px 4px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(145deg, var(--lime), var(--emerald));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 22px; color: #12051a;
    box-shadow: 0 6px 20px rgba(214,61,255,0.35);
  }
  .brand-name { font-size: 21px; font-weight: 900; letter-spacing: 0.3px; }
  .brand-name .u { color: var(--lime); }

  .balance {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--stroke);
    color: var(--text); font-weight: 800; font-size: 15px;
    padding: 8px 10px 8px 14px; border-radius: 999px;
  }
  .balance .coin { color: var(--lime); }
  .balance .add {
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: linear-gradient(145deg, var(--lime), var(--emerald));
    color: #12051a; font-size: 20px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }

  .screen { display: none; animation: fade .25s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); padding: 18px;
  }
  .card + .card { margin-top: 14px; }
  .press { transition: transform .08s ease, filter .08s ease; cursor: pointer; }
  .press:active { transform: scale(0.96); filter: brightness(1.1); }
  .label { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .section-title { font-size: 14px; font-weight: 800; color: var(--muted); margin: 22px 4px 12px; text-transform: uppercase; letter-spacing: 1px; }

  .wheel-wrap { display: flex; flex-direction: column; align-items: center; margin: 4px 0 6px; }
  .wheel-stage { position: relative; width: 260px; height: 260px; }

  .wheel {
    width: 260px; height: 260px; border-radius: 50%;
    background: conic-gradient(var(--emerald) 0deg 180deg, #241331 180deg 360deg);
    border: 3px solid var(--stroke);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4), 0 0 50px rgba(255,46,227,0.15);
  }

  .needle-rotor {
    position: absolute; inset: 0; z-index: 3;
    transform-origin: 50% 50%;
    transition: transform 4.2s cubic-bezier(.15,.75,.15,1);
    pointer-events: none;
  }
  .needle {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 40px solid var(--lime);
    filter: drop-shadow(0 0 10px rgba(214,61,255,0.9));
  }
  .needle-dot {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--lime); box-shadow: 0 0 14px rgba(214,61,255,0.8);
  }

  .wheel-hub {
    position: absolute; inset: 46px; border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 50% 40%, #241035, #0b0412 80%);
    border: 1px solid var(--stroke);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .wheel-pct { font-size: 48px; font-weight: 900; }
  .wheel-sub { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .wheel-result { margin-top: 14px; font-size: 17px; font-weight: 900; min-height: 22px; letter-spacing: 0.3px; }
  .wheel-result.win { color: var(--lime); }
  .wheel-result.lose { color: var(--danger); }

  .upg-slots { display: flex; align-items: stretch; gap: 10px; margin-top: 6px; }
  .slot {
    flex: 1; background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); padding: 14px 10px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-height: 118px; justify-content: center;
  }
  .slot.want { border-color: rgba(255,46,227,0.4); }
  .slot .slot-cap { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .slot .slot-emoji { font-size: 40px; line-height: 1; }
  .slot .slot-name { font-size: 13.5px; font-weight: 800; }
  .slot .slot-price { font-size: 12.5px; color: var(--lime); font-weight: 800; }
  .slot .slot-empty { font-size: 13px; color: var(--muted); font-weight: 700; }
  .upg-arrow { align-self: center; font-size: 22px; color: var(--emerald); font-weight: 900; }

  .coef-line { text-align: center; margin-top: 12px; font-size: 13.5px; color: var(--muted); font-weight: 700; }
  .coef-line b { color: var(--lime); font-size: 15px; }

  .upgrade-btn {
    width: 100%; margin-top: 14px; border: none;
    background: linear-gradient(145deg, var(--lime), var(--emerald));
    color: #12051a; font-weight: 900; font-size: 18px; letter-spacing: 0.5px;
    padding: 17px; border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(255,46,227,0.4);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .upgrade-btn:disabled { opacity: 0.45; filter: grayscale(0.4); box-shadow: none; cursor: default; }

  .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .case-card {
    background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); padding: 18px 14px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .case-emoji {
    font-size: 46px; line-height: 1;
    filter: drop-shadow(0 6px 14px rgba(255,46,227,0.25));
  }
  .case-name { font-size: 15px; font-weight: 800; }
  .case-open {
    margin-top: 4px; width: 100%; border: none; border-radius: var(--radius-sm);
    background: linear-gradient(145deg, var(--lime), var(--emerald));
    color: #12051a; font-weight: 900; font-size: 14px; padding: 11px 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .id-card { display: flex; align-items: center; gap: 14px; }
  .id-avatar {
    width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
    background: linear-gradient(145deg, var(--cyan), var(--emerald));
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: #12051a;
    box-shadow: 0 6px 20px rgba(139,92,255,0.3);
  }
  .id-info { min-width: 0; }
  .id-value { font-size: 22px; font-weight: 900; margin-top: 3px; font-variant-numeric: tabular-nums; }

  .upg-stat { text-align: center; padding: 26px 18px; }
  .upg-num {
    font-size: 52px; font-weight: 900; line-height: 1;
    background: linear-gradient(145deg, var(--lime), var(--emerald));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .upg-stat .label { margin-top: 8px; }

  .promo-row { display: flex; gap: 10px; margin-top: 12px; }
  .promo-input {
    flex: 1; background: var(--field); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); color: var(--text); font-size: 15px;
    padding: 14px; outline: none;
  }
  .promo-input:focus { border-color: var(--emerald); }
  .promo-input::placeholder { color: var(--muted); }
  .promo-btn {
    border: none; background: linear-gradient(145deg, var(--lime), var(--emerald));
    color: #12051a; font-weight: 900; font-size: 14px; letter-spacing: 0.5px;
    padding: 0 20px; border-radius: var(--radius-sm);
  }
  .promo-msg { font-size: 13.5px; font-weight: 700; margin-top: 10px; min-height: 18px; }
  .promo-msg.ok { color: var(--emerald); }
  .promo-msg.err { color: var(--danger); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; z-index: 50;
    display: flex; gap: 6px;
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(8,4,13,0.4), var(--bg) 40%);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--stroke);
  }
  .nav-btn {
    flex: 1; border: none; background: none; color: var(--muted);
    font-weight: 800; font-size: 11.5px; letter-spacing: 0.3px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0 6px; border-radius: 14px; cursor: pointer;
    transition: color .15s ease, background .15s ease, transform .08s ease;
  }
  .nav-btn .nav-ic { font-size: 22px; line-height: 1; }
  .nav-btn.active {
    color: var(--lime);
    background: rgba(214,61,255,0.08);
  }
  .nav-btn:active { transform: scale(0.94); }

  .sheet-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .sheet-overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-width: 480px; margin: 0 auto;
    background: var(--bg-2); border-top: 1px solid var(--stroke);
    border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    max-height: 76vh; overflow-y: auto;
  }
  .sheet-overlay.show .sheet { transform: translateY(0); }
  .sheet-handle { width: 44px; height: 4px; border-radius: 999px; background: var(--stroke); margin: 2px auto 14px; }
  .sheet-title { font-size: 16px; font-weight: 900; margin-bottom: 14px; text-align: center; }
  .picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick-item {
    background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    padding: 14px 8px; text-align: center; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: border-color .15s ease, transform .08s ease;
  }
  .pick-item:active { transform: scale(0.96); }
  .pick-item.selected { border-color: var(--emerald); background: var(--card-2); }
  .pick-emoji { font-size: 36px; line-height: 1; }
  .pick-name { font-size: 13px; font-weight: 800; }
  .pick-price { font-size: 12px; color: var(--lime); font-weight: 800; }
  .pick-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-weight: 700; padding: 24px 0; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
    background: var(--card-2); border: 1px solid var(--stroke); color: var(--text);
    padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 300;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================
     СОДЕРЖИМОЕ КЕЙСА
     ============================================================ */
  .odds-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid var(--stroke);
  }
  .odds-row:last-child { border-bottom: none; }
  .odds-emoji { font-size: 26px; width: 32px; text-align: center; }
  .odds-name { flex: 1; font-size: 13.5px; font-weight: 700; }
  .odds-value { font-size: 12px; color: var(--lime); font-weight: 800; }
  .odds-chance { font-size: 12px; color: var(--muted); font-weight: 700; min-width: 46px; text-align: right; }

  /* ============================================================
     АНИМАЦИЯ ОТКРЫТИЯ КЕЙСА
     ============================================================ */
  .case-open-overlay {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(5,2,9,0.9); display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .case-open-overlay.show { opacity: 1; pointer-events: auto; }

  .reel-viewport {
    position: relative; width: 100%; max-width: 420px; height: 120px;
    overflow: hidden; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--stroke);
  }
  .reel-marker {
    position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 3px; background: var(--lime); z-index: 5;
    box-shadow: 0 0 12px rgba(214,61,255,0.8);
  }
  .reel-track {
    position: absolute; top: 0; left: 0; height: 100%;
    display: flex; align-items: center;
    transition: transform 4.5s cubic-bezier(.08,.82,.11,1);
  }
  .reel-item {
    width: 92px; height: 92px; margin: 0 6px; flex-shrink: 0;
    background: var(--card-2); border: 1px solid var(--stroke); border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .reel-item .re-emoji { font-size: 34px; }
  .reel-item .re-value { font-size: 11px; color: var(--lime); font-weight: 800; }
  .reel-item.re-common { border-color: var(--stroke); }
  .reel-item.re-rare { border-color: rgba(139,92,255,0.5); }
  .reel-item.re-epic { border-color: rgba(214,61,255,0.5); }
  .reel-item.re-legendary { border-color: rgba(255,46,227,0.6); box-shadow: 0 0 16px rgba(255,46,227,0.25); }

  .reel-result {
    margin-top: 22px; font-size: 20px; font-weight: 900; text-align: center; min-height: 28px;
  }
  .reel-close-btn {
    margin-top: 18px; border: none; background: var(--card); border: 1px solid var(--stroke);
    color: var(--text); font-weight: 800; padding: 12px 26px; border-radius: var(--radius-sm);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .reel-close-btn.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">B</div>
      <div class="brand-name">Brain<span class="u">U</span>P</div>
    </div>
    <div class="balance">
      <span class="coin">🪙</span>
      <span id="balanceValue">0</span>
      <button class="add press" id="addBalanceBtn" aria-label="Пополнить">+</button>
    </div>
  </header>

  <main class="screen" id="screen-cases">
    <div class="section-title">Ежедневный кейс</div>
    <div class="card" style="text-align:center; padding: 24px 18px;">
      <div style="font-size:48px; line-height:1;">🎁</div>
      <div style="font-weight:900; font-size:16px; margin-top:8px;">Бесплатный кейс</div>
      <div class="label" id="dailyStatus" style="margin-top:8px; font-size:12.5px;">Проверяем...</div>
      <button class="case-open press" id="dailyOpenBtn" style="margin-top:14px;" disabled>Открыть</button>
    </div>

    <div class="section-title">Кейсы</div>
    <div class="cases-grid" id="casesGrid"></div>
  </main>

  <main class="screen active" id="screen-upgrader">
    <div class="wheel-wrap">
      <div class="wheel-stage">
        <div class="wheel" id="wheel"></div>
        <div class="needle-rotor" id="rotor">
          <div class="needle"></div>
        </div>
        <div class="wheel-hub">
          <div class="wheel-pct" id="wheelPct">—</div>
          <div class="wheel-sub">шанс</div>
        </div>
        <div class="needle-dot"></div>
      </div>
      <div class="wheel-result" id="wheelResult"></div>
    </div>

    <div class="upg-slots">
      <div class="slot have press" id="slotHave">
        <div class="slot-cap">У меня есть</div>
        <div class="slot-empty">Выбрать</div>
      </div>
      <div class="upg-arrow">→</div>
      <div class="slot want press" id="slotWant">
        <div class="slot-cap">Хочу выбить</div>
        <div class="slot-empty">Выбрать</div>
      </div>
    </div>

    <div class="coef-line" id="coefLine">Выберите оба предмета для расчёта шанса</div>

    <button class="upgrade-btn press" id="upgradeBtn" disabled>⚡ КРУТИТЬ</button>
  </main>

  <main class="screen" id="screen-profile">
    <div class="card id-card">
      <div class="id-avatar" id="idAvatar">U</div>
      <div class="id-info">
        <div class="label">Telegram ID</div>
        <div class="id-value" id="profileId">—</div>
      </div>
    </div>

    <div class="card upg-stat">
      <div class="upg-num" id="statUpgrades">0</div>
      <div class="label">Сделано апгрейдов</div>
    </div>

    <div class="card">
      <div class="label">Промокод</div>
      <div class="promo-row">
        <input class="promo-input" id="promoInput" placeholder="Введите промокод" autocomplete="off" />
        <button class="promo-btn press" id="promoBtn">ОК</button>
      </div>
      <div class="promo-msg" id="promoMsg"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="cases"><span class="nav-ic">🎁</span>Кейсы</button>
    <button class="nav-btn active" data-tab="upgrader"><span class="nav-ic">⚡</span>Апгрейдер</button>
    <button class="nav-btn" data-tab="profile"><span class="nav-ic">👤</span>Профиль</button>
  </nav>

  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="sheetTitle">Выбор предмета</div>
      <div class="picker-grid" id="pickerGrid"></div>
    </div>
  </div>

  <div class="sheet-overlay" id="oddsOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="oddsTitle">Содержимое кейса</div>
      <div id="oddsList"></div>
    </div>
  </div>

  <div class="case-open-overlay" id="caseOpenOverlay">
    <div class="reel-viewport">
      <div class="reel-marker"></div>
      <div class="reel-track" id="reelTrack"></div>
    </div>
    <div class="reel-result" id="reelResult"></div>
    <button class="reel-close-btn" id="reelCloseBtn">Закрыть</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const API_URL = "";

  const RARITY_EMOJI = {
    common: '🥥',
    rare: '🐸',
    epic: '🦈',
    legendary: '👑',
  };
  function emojiFor(rarity) { return RARITY_EMOJI[rarity] || '❔'; }

  const state = {
    balance: 0,
    tgId: null,
    upgrades: 0,
    inventory: [],
    allItems: [],
    cases: [],
    haveInvId: null,
    wantItemId: null,
    chance: 0,
    spinning: false,
    rotation: 0,
    _name: '',
  };

  const $ = (id) => document.getElementById(id);

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

  async function api(path, options = {}) {
    const headers = Object.assign(
      { "X-Init-Data": tg ? tg.initData : "" },
      options.headers || {}
    );
    const res = await fetch(API_URL + path, Object.assign({}, options, { headers }));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || "Ошибка запроса");
    return data;
  }

  document.querySelectorAll('.nav-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
      btn.classList.add('active');
      $('screen-' + btn.dataset.tab).classList.add('active');
    });
  });

  let dailyTimer = null;

  function updateDailyUI(data) {
    clearInterval(dailyTimer);
    const btn = $('dailyOpenBtn');
    const statusEl = $('dailyStatus');

    if (data.can_claim) {
      statusEl.textContent = 'Доступен прямо сейчас!';
      btn.disabled = false;
      btn.textContent = '🎁 Открыть';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Уже открыт';
    let secondsLeft = data.seconds_left;

    function tick() {
      if (secondsLeft <= 0) {
        clearInterval(dailyTimer);
        loadDailyStatus();
        return;
      }
      const h = Math.floor(secondsLeft / 3600);
      const m = Math.floor((secondsLeft % 3600) / 60);
      const s = secondsLeft % 60;
      statusEl.textContent = `Следующий через ${h}ч ${m}м ${s}с`;
      secondsLeft--;
    }
    tick();
    dailyTimer = setInterval(tick, 1000);
  }

  async function loadDailyStatus() {
    try {
      const data = await api('/api/daily/status');
      updateDailyUI(data);
    } catch (e) {
      showToast('Не удалось проверить кейс');
    }
  }

  $('dailyOpenBtn').addEventListener('click', async () => {
    try {
      const data = await api('/api/daily/open', { method: 'POST' });
      showToast(`Выпало: ${data.item.name} (${data.item.rarity})!`);
      await loadProfile();
      await loadInventory();
      await loadDailyStatus();
    } catch (e) {
      showToast(e.message);
    }
  });

  function renderCases() {
    if (!state.cases.length) {
      $('casesGrid').innerHTML = `<div class="pick-empty">Кейсов пока нет</div>`;
      return;
    }
    $('casesGrid').innerHTML = state.cases.map((c) => `
      <div class="case-card">
        <div class="case-emoji" data-info="${c.id}" data-name="${c.name}">📦</div>
        <div class="case-name" data-info="${c.id}" data-name="${c.name}">${c.name}</div>
        <button class="case-open press" data-open="${c.id}">🪙 ${c.price}</button>
      </div>
    `).join('');

    document.querySelectorAll('[data-info]').forEach((el) => {
      el.addEventListener('click', () => showCaseOdds(el.dataset.info, el.dataset.name));
    });

    document.querySelectorAll('[data-open]').forEach((b) => {
      b.addEventListener('click', () => openCaseWithAnimation(b.dataset.open));
    });
  }

  async function loadCases() {
    try {
      const data = await api('/api/cases');
      state.cases = data.cases;
      renderCases();
    } catch (e) {
      showToast('Не удалось загрузить кейсы');
    }
  }

  async function showCaseOdds(caseId, caseName) {
    $('oddsTitle').textContent = caseName;
    $('oddsList').innerHTML = `<div class="pick-empty">Загрузка...</div>`;
    $('oddsOverlay').classList.add('show');
    try {
      const data = await api(`/api/cases/${caseId}/items`);
      $('oddsList').innerHTML = data.items.map((it) => `
        <div class="odds-row">
          <div class="odds-emoji">${emojiFor(it.rarity)}</div>
          <div class="odds-name">${it.name}</div>
          <div class="odds-value">🪙 ${it.value}</div>
          <div class="odds-chance">${it.chance}%</div>
        </div>
      `).join('');
    } catch (e) {
      $('oddsList').innerHTML = `<div class="pick-empty">Не удалось загрузить</div>`;
    }
  }
  $('oddsOverlay').addEventListener('click', (e) => {
    if (e.target === $('oddsOverlay')) $('oddsOverlay').classList.remove('show');
  });

  const REEL_ITEM_WIDTH = 104;
  const REEL_LENGTH = 40;
  const REEL_WIN_INDEX = 34;

  async function openCaseWithAnimation(caseId) {
    let result;
    try {
      result = await api(`/api/cases/${caseId}/open`, { method: 'POST' });
    } catch (e) {
      showToast(e.message);
      return;
    }

    let pool = [];
    try {
      const data = await api(`/api/cases/${caseId}/items`);
      pool = data.items;
    } catch (e) {
      pool = [{ name: result.item.name, rarity: result.item.rarity, value: 0 }];
    }

    const track = [];
    for (let i = 0; i < REEL_LENGTH; i++) {
      if (i === REEL_WIN_INDEX) {
        track.push(result.item);
      } else {
        track.push(pool[Math.floor(Math.random() * pool.length)]);
      }
    }

    $('reelTrack').innerHTML = track.map((it) => `
      <div class="reel-item re-${it.rarity}">
        <div class="re-emoji">${emojiFor(it.rarity)}</div>
        <div class="re-value">🪙 ${it.value || ''}</div>
      </div>
    `).join('');

    const trackEl = $('reelTrack');
    trackEl.style.transition = 'none';
    trackEl.style.transform = 'translateX(0px)';
    $('reelResult').textContent = '';
    $('reelCloseBtn').classList.remove('show');
    $('caseOpenOverlay').classList.add('show');

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const viewportWidth = trackEl.parentElement.clientWidth;
        const targetOffset = REEL_WIN_INDEX * REEL_ITEM_WIDTH + REEL_ITEM_WIDTH / 2 - viewportWidth / 2;
        trackEl.style.transition = '';
        trackEl.style.transform = `translateX(-${targetOffset}px)`;
      });
    });

    setTimeout(() => {
      $('reelResult').textContent = `🎉 ${result.item.name} (${result.item.rarity})`;
      $('reelCloseBtn').classList.add('show');
    }, 4600);
  }

  $('reelCloseBtn').addEventListener('click', async () => {
    $('caseOpenOverlay').classList.remove('show');
    await loadProfile();
    await loadInventory();
  });

  const wheelEl = $('wheel');
  const rotorEl = $('rotor');

  function renderWheel() {
    const deg = state.chance / 100 * 360;
    wheelEl.style.background =
      `conic-gradient(var(--emerald) 0deg ${deg}deg, #241331 ${deg}deg 360deg)`;
    $('wheelPct').textContent = state.chance ? state.chance + '%' : '—';
  }

  function getHave() { return state.inventory.find((i) => i.inventory_item_id == state.haveInvId) || null; }
  function getWant() { return state.allItems.find((i) => i.id == state.wantItemId) || null; }

  function computeChance(have, want) {
    if (!have || !want || want.value <= 0) return 0;
    let chance = (have.value / want.value) * 0.9 * 100;
    return Math.max(2, Math.min(95, Math.round(chance)));
  }

  function renderSlots() {
    const have = getHave();
    const want = getWant();

    $('slotHave').innerHTML = have
      ? `<div class="slot-cap">У меня есть</div><div class="slot-emoji">${emojiFor(have.rarity)}</div>
         <div class="slot-name">${have.name}</div><div class="slot-price">🪙 ${have.value}</div>`
      : `<div class="slot-cap">У меня есть</div><div class="slot-empty">Выбрать</div>`;

    $('slotWant').innerHTML = want
      ? `<div class="slot-cap">Хочу выбить</div><div class="slot-emoji">${emojiFor(want.rarity)}</div>
         <div class="slot-name">${want.name}</div><div class="slot-price">🪙 ${want.value}</div>`
      : `<div class="slot-cap">Хочу выбить</div><div class="slot-empty">Выбрать</div>`;

    state.chance = computeChance(have, want);

    if (have && want && want.value > have.value) {
      const coef = (want.value / have.value).toFixed(1).replace(/\.0$/, '');
      $('coefLine').innerHTML = `Коэффициент <b>x${coef}</b> · шанс <b>${state.chance}%</b>`;
      $('upgradeBtn').disabled = state.spinning;
    } else if (have && want) {
      $('coefLine').textContent = 'Цель должна быть дороже исходного предмета';
      $('upgradeBtn').disabled = true;
    } else {
      $('coefLine').textContent = 'Выберите оба предмета для расчёта шанса';
      $('upgradeBtn').disabled = true;
    }
    renderWheel();
  }

  let pickMode = null;

  function openPicker(mode) {
    if (state.spinning) return;
    pickMode = mode;
    const list = mode === 'have' ? state.inventory : state.allItems;
    $('sheetTitle').textContent = mode === 'have' ? 'Что у тебя есть' : 'Что хочешь выбить';

    if (!list.length) {
      $('pickerGrid').innerHTML = `<div class="pick-empty">${mode === 'have' ? 'Инвентарь пуст — сначала открой кейс' : 'Список предметов пуст'}</div>`;
    } else {
      $('pickerGrid').innerHTML = list.map((it) => {
        const key = mode === 'have' ? it.inventory_item_id : it.id;
        const selected = mode === 'have' ? (key == state.haveInvId) : (key == state.wantItemId);
        return `
          <div class="pick-item ${selected ? 'selected' : ''}" data-pick="${key}">
            <div class="pick-emoji">${emojiFor(it.rarity)}</div>
            <div class="pick-name">${it.name}</div>
            <div class="pick-price">🪙 ${it.value}</div>
          </div>`;
      }).join('');
      document.querySelectorAll('[data-pick]').forEach((el) => {
        el.addEventListener('click', () => {
          if (pickMode === 'have') state.haveInvId = el.dataset.pick;
          else state.wantItemId = el.dataset.pick;
          closePicker();
          $('wheelResult').textContent = '';
          $('wheelResult').className = 'wheel-result';
          renderSlots();
        });
      });
    }
    $('sheetOverlay').classList.add('show');
  }
  function closePicker() { $('sheetOverlay').classList.remove('show'); }

  $('slotHave').addEventListener('click', () => openPicker('have'));
  $('slotWant').addEventListener('click', () => openPicker('want'));
  $('sheetOverlay').addEventListener('click', (e) => { if (e.target === $('sheetOverlay')) closePicker(); });

  async function spin() {
    if (state.spinning) return;
    const have = getHave();
    const want = getWant();
    if (!have || !want) return;

    state.spinning = true;
    $('upgradeBtn').disabled = true;
    $('wheelResult').textContent = '';
    $('wheelResult').className = 'wheel-result';

    let result;
    try {
      result = await api(
        `/api/upgrade?inventory_item_id=${have.inventory_item_id}&target_item_id=${want.id}`,
        { method: 'POST' }
      );
    } catch (e) {
      state.spinning = false;
      $('upgradeBtn').disabled = false;
      showToast(e.message);
      return;
    }

    const chanceDeg = state.chance / 100 * 360;
    const win = result.success;
    const target = win
      ? Math.random() * (chanceDeg - 6) + 3
      : Math.random() * (360 - chanceDeg - 6) + chanceDeg + 3;

    const currentMod = ((state.rotation % 360) + 360) % 360;
    const add = 5 * 360 + (((target - currentMod) % 360) + 360) % 360;
    state.rotation += add;
    rotorEl.style.transform = `rotate(${state.rotation}deg)`;

    setTimeout(async () => {
      state.spinning = false;
      const res = $('wheelResult');
      if (win) {
        res.textContent = '🎉 ВЫИГРЫШ! ' + emojiFor(want.rarity) + ' ' + result.won_item;
        res.className = 'wheel-result win';
      } else {
        res.textContent = '💀 ПРОИГРЫШ — потерян ' + result.lost_item;
        res.className = 'wheel-result lose';
      }
      state.upgrades += 1;
      $('statUpgrades').textContent = state.upgrades;

      state.haveInvId = null;
      state.wantItemId = null;
      await loadInventory();
      await loadProfile();
      renderSlots();
    }, 4300);
  }
  $('upgradeBtn').addEventListener('click', spin);

  $('promoBtn').addEventListener('click', () => {
    const code = $('promoInput').value.trim();
    const msg = $('promoMsg');
    if (!code) { msg.textContent = 'Введите промокод'; msg.className = 'promo-msg err'; return; }
    msg.textContent = 'Промокоды скоро будут доступны';
    msg.className = 'promo-msg ok';
    $('promoInput').value = '';
  });

  function showToast(text) {
    const t = $('toast');
    t.textContent = text; t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 2500);
  }
  $('addBalanceBtn').addEventListener('click', () => {
    showToast('Пополнение баланса скоро будет доступно');
  });

  async function loadProfile() {
    try {
      const data = await api('/api/profile');
      state.balance = data.balance;
      $('balanceValue').textContent = Math.round(state.balance);
      $('profileId').textContent = state.tgId != null ? state.tgId : 'Не определён';
    } catch (e) {
      showToast('Не удалось загрузить профиль');
    }
  }

  async function loadInventory() {
    try {
      const inv = await api('/api/inventory');
      state.inventory = inv.inventory;
      const items = await api('/api/items');
      state.allItems = items.items;
    } catch (e) {
      showToast('Не удалось загрузить инвентарь');
    }
  }

  function initTelegram() {
    if (!tg) return;
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#08040d'); tg.setBackgroundColor('#08040d'); } catch (e) {}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) { state.tgId = u.id; state._name = (u.first_name || '').trim(); }
  }

  async function boot() {
    initTelegram();
    await loadProfile();
    await loadInventory();
    await loadDailyStatus();
    await loadCases();
    renderSlots();
    const av = state._name ? state._name[0].toUpperCase()
             : (state.tgId ? String(state.tgId).slice(-1) : 'U');
    $('idAvatar').textContent = av;
  }

  boot();
</script>
</body>
</html>
