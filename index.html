<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainUp Roblox Upgrader</title>
    <style>
        body { font-family: sans-serif; background-color: #1c1c1e; color: #fff; margin: 0; padding: 20px; padding-bottom: 80px; }
        .tab-content { display: none; text-align: center; margin-top: 40px; }
        .active { display: block; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background-color: #3a3a3c; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .card { background-color: #2c2c2e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: left; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #3a3a3c; color: #fff; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
        button.main-btn { width: 100%; padding: 14px; border-radius: 8px; border: none; background-color: #007aff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background-color: #121212; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #2c2c2e; }
        .tab-btn { background: none; border: none; color: #8e8e93; display: flex; flex-direction: column; align-items: center; font-size: 12px; cursor: pointer; }
        .tab-btn.active-tab { color: #007aff; }
        .icon { font-size: 20px; margin-bottom: 4px; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <!-- ВКЛАДКА ПРОФИЛЬ -->
    <div id="profile" class="tab-content active">
        <div class="avatar">👤</div>
        <h2>Твой Профиль</h2>
        <p style="color: #8e8e93;">Статус: Готов к прокачке мозга 🧠</p>
    </div>
    <!-- ВКЛАДКА АПГРЕЙДЕР -->
    <div id="upgrader" class="tab-content">
        <h2 style="text-align: center; margin-bottom: 20px;">🚀 Апгрейдер Брейниротов</h2>
        <div class="card">
            <label style="display: block; margin-bottom: 8px; color: #aeaeac;">Твой ник в Roblox:</label>
            <input type="text" id="robloxNick" placeholder="Например: Builderman">
            <button class="main-btn" onclick="sendData()">Получить Брейнирот</button>
            <div id="status"></div>
        </div>
    </div>
    <!-- НИЖНИЙ ТАББАР -->
    <div class="tabbar">
        <button id="btn-profile" class="tab-btn active-tab" onclick="switchTab('profile')">
            <span class="icon">👤</span><span>Профиль</span>
        </button>
        <button id="btn-upgrader" class="tab-btn" onclick="switchTab('upgrader')">
            <span class="icon">🚀</span><span>Апгрейдер</span>
        </button>
    </div>
    <script>
        // НАСТРОЙКА (Впиши свои данные между кавычек):
        const BOT_TOKEN = 'СЮДА_ТОКЕН_БОТА_ИЗ_BOTFATHER';
        const FRIEND_CHAT_ID = 'СЮДА_TELEGRAM_ID_ДРУГА';

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active-tab');
        }
        async function sendData() {
            const nick = document.getElementById('robloxNick').value.trim();
            const statusEl = document.getElementById('status');
            if(!nick) { statusEl.innerText = '❌ Введи ник в Roblox!'; return; }
            statusEl.innerText = '⏳ Отправка заявки...';
            const text = `🚨 *Новая заявка на Брейнирот!*\n👤 Ник в Roblox: ${nick}\n\n👉 Добавь его в друзья и передай брейнирот!`;
            try {
                const res = await fetch(`https://telegram.org{BOT_TOKEN}/sendMessage?chat_id=${FRIEND_CHAT_ID}&text=${encodeURIComponent(text)}`);
                if(res.ok) {
                    statusEl.innerText = '✅ Отправлено! Жди запрос в Roblox!';
                    document.getElementById('robloxNick').value = '';
                } else { statusEl.innerText = '❌ Ошибка. Проверь Токен и ID.'; }
            } catch(e) { statusEl.innerText = '❌ Ошибка сети.'; }
        }
    </script>
</body>
</html>
